# CI fuer das Website-Template.
#
# Geprueft wird das, was spaeter wirklich ausgeliefert wird: der statische
# Export in out/, bedient von wrangler (derselben Runtime wie Cloudflare
# Pages) samt public/_headers, public/_redirects und den Pages Functions.
# Ein gruener `next build` allein sagt darueber nichts - siehe PLAN.md,
# Abschnitt "Der Export schuetzt nicht".

name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Ein neuer Push auf denselben Branch macht den laufenden Job ueberfluessig.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Version aus .nvmrc, damit CI und Entwicklungsrechner nicht
          # auseinanderlaufen. Cloudflare Pages braucht dieselbe Angabe als
          # NODE_VERSION im Dashboard (Deployment-Checkliste in der README).
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:run

      # Enthaelt die Export-Pruefung (scripts/check-static-export.mjs) und
      # erzeugt out/ - genau der Build, den Cloudflare Pages ausfuehrt.
      - name: Build (Cloudflare-Export)
        run: npm run build

      - name: Export-Ergebnis pruefen
        run: |
          test -f out/index.html
          test -f out/_headers
          test -f out/_redirects
          echo "out/ enthaelt $(find out -type f | wc -l) Dateien."

      # Nur Chromium: die e2e-Konfiguration definiert kein weiteres Projekt.
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      # Startet ueber webServer den Build in wrangler (siehe
      # playwright.config.ts). Kein zweiter `npm run build` noetig - out/
      # liegt aus dem Schritt oben bereits vor.
      - name: E2E-Tests
        run: npx playwright test
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Playwright-Bericht sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
